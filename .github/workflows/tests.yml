name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['10.*', '11.*', '12.*', '13.*']
        exclude:
          # Laravel 13 requires PHP ^8.3.
          - php: '8.2'
            laravel: '13.*'
          # Laravel 10 and 11 are closed branches. They declare no upper PHP bound and would
          # install, but nobody ever tested them against interpreters released after they were
          # archived, so a red job here would report on the framework, not on this package.
          - php: '8.4'
            laravel: '10.*'
          - php: '8.5'
            laravel: '10.*'
          - php: '8.5'
            laravel: '11.*'
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gmp, bcmath, sodium
      # Every 10.x and 11.x release carries unpatched advisories and no fixed release exists,
      # so Composer refuses to resolve the framework under its default policy. The package
      # itself is unaffected: a consumer already running Laravel 10 or 11 keeps the framework
      # it has. Only building such an environment from scratch, as CI does, needs the opt-out,
      # and it is scoped to these two jobs so the supported branches stay under the policy.
      - name: Allow the closed Laravel branches to resolve
        if: matrix.laravel == '10.*' || matrix.laravel == '11.*'
        run: echo "COMPOSER_NO_BLOCKING=1" >> "$GITHUB_ENV"
      - run: composer require "illuminate/support:${{ matrix.laravel }}" --no-interaction --no-update
      - run: composer update --prefer-dist --no-interaction
      - run: vendor/bin/pest
